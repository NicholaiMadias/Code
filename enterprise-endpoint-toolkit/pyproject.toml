[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-endpoint-toolkit"
version = "0.1.0"
description = "Read-only enterprise endpoint compliance reporting and dashboard examples"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
endpoint-toolkit = "endpoint_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
